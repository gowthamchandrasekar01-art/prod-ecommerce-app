name: ShopNest CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: shopnest-production
  cancel-in-progress: false

jobs:
  backend_tests:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  frontend_validate:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_URL: https://api.gowthamcloud.site
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopnest-frontend-dist
          path: frontend/dist

  terraform_validate:
    name: Terraform validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate

  deploy:
    name: Deploy ShopNest
    runs-on: ubuntu-latest

    needs:
      - backend_tests
      - frontend_validate
      - terraform_validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: shopnest-frontend-dist
          path: frontend/dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::809311528378:role/prod-ecommerce-github-actions
          aws-region: ap-south-1

      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend/dist/ \
            s3://prod-ecommerce-frontend-809311528378-ap-south-1-an/ \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1EVTNHGR00ED1 \
            --paths "/*"

      - name: Deploy backend with SSM
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Name,Values=prod-ecommerce-app-server" \
            --document-name "AWS-RunShellScript" \
            --comment "ShopNest deployment from GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "cd /opt/prod-ecommerce-app",
              "git fetch origin main",
              "git reset --hard origin/main",
              "cd backend",
              "npm ci --omit=dev",
              "pm2 restart prod-ecommerce-api --update-env",
              "sleep 5",
              "curl -f http://localhost:3000/health"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query 'CommandInvocations[].Status' \
              --output text)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "SSM deployment timed out"
          exit 1

      - name: Verify frontend
        run: |
          curl --fail --silent --show-error \
            https://shopnest.gowthamcloud.site/

      - name: Verify API
        run: |
          curl --fail --silent --show-error \
            https://api.gowthamcloud.site/health
